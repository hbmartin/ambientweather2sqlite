<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<title>LiveData</title>
</head>
<body>
<form name="livedata" method="post" action="livedata.htm">
<table width="510" border="1" align="center">
  <tr>
    <td colspan="2" align="center"><strong>Live Data</strong></td>
  </tr>
  <tr>
    <td width="45%" align="right">Receiver Time</td>
    <td width="55%"><input name="CurrTime" disabled="disabled" type="text" value="14:47 9/21/2021" /></td>
  </tr>
  <tr>
    <td align="right">Indoor Sensor ID and Battery</td>
    <td><input name="IDACC" disabled="disabled" type="text" value="0x82" />
        <input name="inBattSta" disabled="disabled" type="text" value="Normal" /></td>
  </tr>
  <tr>
    <td align="right">Outdoor Sensor ID and Battery</td>
    <td><input name="IDTran" disabled="disabled" type="text" value="0x94" />
        <input name="outBattSta1" disabled="disabled" type="text" value="Normal" /></td>
  </tr>
  <tr>
    <td align="right">Indoor Temperature</td>
    <td><input name="inTemp" disabled="disabled" type="text" value="72.3" /></td>
  </tr>
  <tr>
    <td align="right">Indoor Humidity</td>
    <td><input name="inHumi" disabled="disabled" type="text" value="41" /></td>
  </tr>
  <tr>
    <td align="right">Absolute Pressure</td>
    <td><input name="AbsPress" disabled="disabled" type="text" value="28.79" /></td>
  </tr>
  <tr>
    <td align="right">Relative Pressure</td>
    <td><input name="RelPress" disabled="disabled" type="text" value="29.91" /></td>
  </tr>
  <tr>
    <td align="right">Outdoor Temperature</td>
    <td><input name="outTemp" disabled="disabled" type="text" value="64.9" /></td>
  </tr>
  <tr>
    <td align="right">Outdoor Humidity</td>
    <td><input name="outHumi" disabled="disabled" type="text" value="78" /></td>
  </tr>
  <tr>
    <td align="right">Wind Direction</td>
    <td><input name="windir" disabled="disabled" type="text" value="271" /></td>
  </tr>
  <tr>
    <td align="right">Wind Speed</td>
    <td><input name="avgwind" disabled="disabled" type="text" value="2.7" /></td>
  </tr>
  <tr>
    <td align="right">Gust Speed</td>
    <td><input name="gustspeed" disabled="disabled" type="text" value="4.5" /></td>
  </tr>
  <tr>
    <td align="right">Solar Radiation</td>
    <td><input name="solarrad" disabled="disabled" type="text" value="105.98" /></td>
  </tr>
  <tr>
    <td align="right">UV</td>
    <td><input name="uv" disabled="disabled" type="text" value="351" /></td>
  </tr>
  <tr>
    <td align="right">UVI</td>
    <td><input name="uvi" disabled="disabled" type="text" value="1" /></td>
  </tr>
  <tr>
    <td align="right">Hourly Rain Rate</td>
    <td><input name="rainofhourly" disabled="disabled" type="text" value="0.00" /></td>
  </tr>
  <tr>
    <td align="right">Event Rain</td>
    <td><input name="eventrain" disabled="disabled" type="text" value="0.12" /></td>
  </tr>
  <tr>
    <td align="right">Daily Rain</td>
    <td><input name="rainofdaily" disabled="disabled" type="text" value="0.24" /></td>
  </tr>
  <tr>
    <td colspan="2" align="center"><input type="submit" name="rainreset" value="Rain Reset" /></td>
  </tr>
</table>
</form>
</body>
</html>
