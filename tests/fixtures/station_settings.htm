<!DOCTYPE html>
<html>
<head><title>Station Settings</title></head>
<body>
<form name="station" method="post" action="station.htm">
<table align="center">
  <tr>
    <td><div class="item_1">Wind</div></td>
    <td>
      <select name="unit_Wind" class="item_2">
        <option value="0">m/s</option>
        <option value="1">km/h</option>
        <option value="2">ft/s</option>
        <option value="3" selected="selected">mph</option>
        <option value="4">knot</option>
      </select>
    </td>
  </tr>
  <tr>
    <td><div class="item_1">Rainfall</div></td>
    <td>
      <select name="unit_Rainfall" class="item_2">
        <option value="0">mm</option>
        <option value="1" selected="selected">in</option>
      </select>
    </td>
  </tr>
  <tr>
    <td><div class="item_1">Pressure</div></td>
    <td>
      <select name="unit_Pressure" class="item_2">
        <option value="0">hpa</option>
        <option value="1" selected="selected">inhg</option>
        <option value="2">mmhg</option>
      </select>
    </td>
  </tr>
  <tr>
    <td><div class="item_1">Temperature</div></td>
    <td>
      <select name="unit_Temperature" class="item_2">
        <option value="0">degC</option>
        <option value="1" selected="selected">degF</option>
      </select>
    </td>
  </tr>
  <tr>
    <td><div class="item_1">Solar Radiation</div></td>
    <td>
      <select name="unit_Solar" class="item_2">
        <option value="0">lux</option>
        <option value="1" selected="selected">w/m2</option>
        <option value="2">fc</option>
      </select>
    </td>
  </tr>
</table>
</form>
</body>
</html>
