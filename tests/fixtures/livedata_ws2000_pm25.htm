<!DOCTYPE html>
<html>
<head><title>LiveData</title></head>
<body>
<form name="livedata" method="post" action="livedata.htm">
<table border="1" align="center">
  <tr>
    <td align="right">Receiver Time</td>
    <td><input name="CurrTime" disabled type="text" value="08:15 1/2/2026"></td>
  </tr>
  <tr>
    <td align="right">Outdoor Sensor ID and Battery</td>
    <td><input name="IDTran" disabled type="text" value="0x51">
        <input name="outBattSta1" disabled type="text" value="Low"></td>
  </tr>
  <tr>
    <td align="right">PM2.5 Sensor Battery</td>
    <td><input name="pm25BattSta" disabled type="text" value="Normal"></td>
  </tr>
  <tr>
    <td align="right">Outdoor Temperature</td>
    <td><input name="outTemp" disabled type="text" value="-3.4"></td>
  </tr>
  <tr>
    <td align="right">Outdoor Humidity</td>
    <td><input name="outHumi" disabled type="text" value="93"></td>
  </tr>
  <tr>
    <td align="right">PM2.5</td>
    <td><input name="pm25" disabled type="text" value="12.0"></td>
  </tr>
  <tr>
    <td align="right">PM2.5 24h Average</td>
    <td><input name="pm25_24h" disabled type="text" value="9.8"></td>
  </tr>
  <tr>
    <td align="right">Soil Moisture</td>
    <td><input name="soilmoisture1" disabled type="text" value="--"></td>
  </tr>
  <tr>
    <td align="right">Wind Speed</td>
    <td><input name="avgwind" disabled type="text" value="0.0"></td>
  </tr>
</table>
</form>
</body>
</html>
