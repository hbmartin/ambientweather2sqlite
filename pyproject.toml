[project]
name = "ambientweather2sqlite"
version = "0.9.0"
description = "A project to record weather observations from an AmbientWeather station over the local network - no API needed!"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = []
authors = [
    { name = "Harold Martin", email = "Harold.Martin@gmail.com" },
]
keywords = ["ambientweather", "ambient", "sqlite", "weather", "weather-station", "datasette", "iot", "home-automation", "climate", "temperature", "humidity", "barometer", "sensor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Datasette",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hbmartin/ambientweather2sqlite"
Repository = "https://github.com/hbmartin/ambientweather2sqlite"
Issues = "https://github.com/hbmartin/ambientweather2sqlite/issues"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project.scripts]
ambientweather2sqlite = "ambientweather2sqlite.__main__:main"
aw2sqlite = "ambientweather2sqlite.__main__:main"

[dependency-groups]
dev = [
    "codecov>=2.1.13",
    "deptry>=0.23.0",
    "hypothesis>=6.130",
    "lizard>=1.23.0",
    "pyrefly>=0.55.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pyroma>=5.0.1",
    "ruff>=0.15.5",
    "ty>=0.0.21",
]

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
fail_under = 92

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "setup.py", "site-packages", "venv"]

# Same as Black.
line-length = 88
indent-width = 4
target-version = "py313"

lint.select = ["ALL"]
lint.ignore = ["ANN204", "COM812", "D100", "D101", "D103", "D104", "D107", "D203", "D205", "D213", "D401", "DTZ005", "EM101", "T201"]

[tool.ruff.lint.per-file-ignores]
"ambientweather2sqlite/configuration.py" = ["E501", "PLC0415"]
"ambientweather2sqlite/database/*.py" = ["S608", "SIM118"]
"ambientweather2sqlite/mureq.py" = ["ANN003", "D105", "D203", "D205", "D213", "D401", "EM101", "ERA001", "FIX003", "TD001", "TD002", "TRY003"]
"ambientweather2sqlite/scanner.py" = ["BLE001", "S110"]
"ambientweather2sqlite/cli/*.py" = ["PLC0415"]
"tests/*.py" = ["A002", "ANN001", "ANN002", "ANN201", "ARG002", "ARG005", "D102", "D400", "D415", "E501", "PLC0415", "PLR0913", "PT009", "PT027", "PT028", "S101", "S104", "S106", "S108", "S310", "S314", "SIM115", "SIM117", "TRY003"]

[tool.ruff.format]
# Same as Black.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.deptry]
known_first_party = ["ambientweather2sqlite"]

[tool.setuptools]
packages = ["ambientweather2sqlite"]
